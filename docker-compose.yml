services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_PORT=8080
    container_name: url-shortener-app
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - postgres_db
    command: ["-storage", "postgres", "-port", "8080"]
    restart: unless-stopped
    networks:
      - app-network

  postgres_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=shortener
    ports:
      - 5432
    networks:
      - app-network
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d/


networks:
  app-network:
    driver: bridge